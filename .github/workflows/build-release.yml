name: Build & Release

run-name: Build and release ${{ inputs.release_tag || 'custom-nightly' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: false
        default: custom-nightly
        type: string
      trigger_source:
        description: What triggered this build
        required: false
        default: manual
        type: string
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: rustdesk-release-${{ inputs.release_tag || 'custom-nightly' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.release_tag || 'custom-nightly' }}
